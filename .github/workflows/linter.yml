name: "Linter"

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - run: git checkout HEAD^2

    - name: Run Linter
      run: |
        docker run --rm -v $PWD:/app composer:2.10.3@sha256:da624c2c705d54e2f5a9bb77a5dc6c7d091711433ebefd7035672e84c2010fee sh -c \
        "composer install --profile --ignore-platform-reqs && composer lint"