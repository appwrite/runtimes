name: "CodeQL"

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Run CodeQL
      run: |
        docker run --rm -v $PWD:/app composer:2.10.3@sha256:da624c2c705d54e2f5a9bb77a5dc6c7d091711433ebefd7035672e84c2010fee sh -c \
        "composer install --profile --ignore-platform-reqs && composer check"